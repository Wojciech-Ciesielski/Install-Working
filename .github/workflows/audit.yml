name: Audit zależności

# Znane podatności w zależnościach Rust (RustSec) i npm. Podatność = czerwony przebieg;
# ostrzeżenia „unmaintained” są tylko wypisywane (patrz OSTRZEŻENIA w logu).
on:
  push:
    paths: ["**/package-lock.json", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/package-lock.json", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [boxes/shrimp-install/ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm audit --package-lock-only --audit-level=moderate
        working-directory: ${{ matrix.dir }}
