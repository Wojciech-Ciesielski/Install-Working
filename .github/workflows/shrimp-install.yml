name: Shrimp Install

on:
  push:
    paths: ["boxes/shrimp-install/**", "boxes/i18n-core/**", "boxes/help-links/**", "boxes/install-schema/**", ".github/workflows/shrimp-install.yml"]
  pull_request:
    paths: ["boxes/shrimp-install/**", "boxes/i18n-core/**", "boxes/help-links/**", "boxes/install-schema/**", ".github/workflows/shrimp-install.yml"]
  workflow_call:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: boxes/shrimp-install/ui } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: boxes/shrimp-install/ui/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: install-ui, path: boxes/shrimp-install/ui/dist/index.html }

  # Kopia nośnika, plan i opis plików, manifest, znaczniki języka: testy bez Windows.
  rust:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: boxes/shrimp-install } }
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - name: Kompilacja dla Windows (sprawdzenie typów bez linkera)
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

  windows:
    needs: [ui, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: install-ui, path: ui-dist }
      - name: Kompilacja (Rust, MSVC)
        # Manifest ISO jest w Cloudflare R2 (wydania CoreOS-Working), a podaje go strona pod /download/ (Site-Working).
        # Adres jest stały, zmienna repozytorium SHRIMP_MANIFEST_URL nie jest już potrzebna.
        working-directory: boxes/shrimp-install
        env:
          SHRIMP_MANIFEST_URL: https://shrimp-organization.dev/download/manifest.json
        run: |
          $env:SHRIMP_UI_HTML = "$env:GITHUB_WORKSPACE\ui-dist\index.html"
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'kompilacja' }
          New-Item -ItemType Directory -Force ..\..\out | Out-Null
          Copy-Item target\release\shrimp-install.exe ..\..\out\shrimp-install.exe
          Get-FileHash ..\..\out\shrimp-install.exe -Algorithm SHA256 | Format-List
          "{0:N1} MB" -f ((Get-Item ..\..\out\shrimp-install.exe).Length / 1MB)
      - name: Dane z Windows (--collect)
        run: |
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--collect', "$PWD\out\collect.json" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          $j = Get-Content out\collect.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $j.user.name) { throw 'brak user.name' }
          if (-not $j.locale.timezone) { throw 'brak locale.timezone' }
          if ($j.apps.Count -lt 1) { throw 'pusta lista programów' }
          if ($j.folders.Count -ne 6) { throw 'brak folderów' }
          "użytkownik: $($j.user.name), strefa: $($j.locale.timezone), programów: $($j.apps.Count), klawiatury: $($j.locale.keyboards -join ',')"
      - name: Kontrakt shrimp.json (boxes/install-schema) dla wyniku --collect i przykładu
        run: |
          $schema = "boxes/install-schema/shrimp.schema.json"
          foreach ($f in 'out\collect.json', 'boxes\install-schema\shrimp.example.json') {
            $ok = Get-Content $f -Raw -Encoding utf8 | Test-Json -SchemaFile $schema -ErrorAction SilentlyContinue -ErrorVariable bad
            if (-not $ok) { $bad | ForEach-Object { $_.ToString() }; throw "$f nie zgadza się ze schematem" }
            "${f}: zgodny ze schematem"
          }
      - name: Kopia zawartości nośnika (--backup-test)
        run: |
          $src = "$env:RUNNER_TEMP\usb-src"; $dst = "$env:RUNNER_TEMP\usb-dst"; $work = "$env:RUNNER_TEMP\usb-work"
          New-Item -ItemType Directory -Force "$src\DCIM\100", "$src\Pusty folder", "$src\Zażółć", $work | Out-Null
          Set-Content "$src\notatka.txt" "pendrive użytkownika" -Encoding utf8
          [IO.File]::WriteAllBytes("$src\DCIM\100\a.bin", [byte[]](1..255 * 4000))
          New-Item -ItemType File "$src\Zażółć\pusty.dat" | Out-Null
          $f = [IO.File]::Create("$src\duzy.iso"); $f.SetLength(4.5GB); $f.Close()
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--backup-test', $src, $dst, $work -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          if (-not (Test-Path "$dst\shrimp-backup\manifest.tsv")) { throw 'brak manifest.tsv' }
          # exFAT mieści pliki > 4 GB: kopia jest jednym plikiem, bez części.
          if ((Get-Item "$dst\shrimp-backup\files\duzy.iso").Length -ne 4.5GB) { throw 'plik > 4 GB nie jest cały' }
          if (Test-Path "$dst\shrimp-backup\files\duzy.iso.shrimp-part000") { throw 'plik > 4 GB został podzielony' }
          if (-not (Test-Path "$dst\shrimp-backup\files\Pusty folder")) { throw 'brak pustego folderu' }
          Get-Content "$dst\shrimp-backup\manifest.tsv"
      - name: Pełny zapis na pusty wirtualny nośnik 32 GB (--auto-disk)
        # Jak u użytkownika: całkowicie pusty dysk (bez tablicy partycji), ISO z ostatniego wydania,
        # potem sprawdzenie układu (FAT32 SHRIMP_BOOT + exFAT SHRIMP_LIVE) i plików. Dziennik trafia do artefaktu.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          SHRIMP_MANIFEST_URL: https://shrimp-organization.dev/download/manifest.json
        run: |
          $tmp = $env:RUNNER_TEMP
          # ISO z ostatniego wydania: manifest w R2 (CoreOS-Working); dopóki go nie ma, ostatnie wydanie ShrimpWorking.
          New-Item -ItemType Directory -Force "$tmp\iso" | Out-Null
          $m = $null
          if ($env:SHRIMP_MANIFEST_URL) { try { $m = Invoke-RestMethod $env:SHRIMP_MANIFEST_URL } catch { "manifest niedostępny: $_" } }
          if ($m) {
            $iso = Join-Path "$tmp\iso" ([IO.Path]::GetFileName(([Uri]$m.url).AbsolutePath))
            curl.exe -fsSL --retry 5 -o $iso $m.url
            if ((Get-FileHash $iso -Algorithm SHA256).Hash -ne $m.sha256.ToUpper()) { throw 'suma SHA-256 ISO z R2 się nie zgadza' }
          } else {
            gh release download --repo Wojciech-Ciesielski/ShrimpWorking --pattern '*.iso' --dir "$tmp\iso"
          }
          $iso = (Get-ChildItem "$tmp\iso\*.iso" | Select-Object -First 1).FullName
          "obraz: $iso ($((Get-Item $iso).Length) B)"
          $vhd = "$tmp\nosnik.vhdx"
          "create vdisk file=`"$vhd`" maximum=30000 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk" | Set-Content "$tmp\dp.txt" -Encoding ascii
          diskpart /s "$tmp\dp.txt" | Out-Host
          $disk = Get-DiskImage -ImagePath $vhd | Get-Disk
          "dysk testowy: numer $($disk.Number), $($disk.Size) B, styl $($disk.PartitionStyle)"
          # Pendrive z plikami użytkownika: mają wrócić w shrimp-backup.
          $disk | Initialize-Disk -PartitionStyle MBR -PassThru | New-Partition -UseMaximumSize -AssignDriveLetter | Format-Volume -FileSystem FAT32 -NewFileSystemLabel PENDRIVE -Confirm:$false | Out-Null
          $old = (Get-Partition -DiskNumber $disk.Number | Get-Volume).Path
          Set-Content -LiteralPath (Join-Path $old 'lista zakupów.txt') 'mleko, chleb' -Encoding utf8
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--source', $iso, '--auto-disk', $disk.Number -PassThru
          $log = "$env:LOCALAPPDATA\Shrimp Install\shrimp-install.log"
          $ok = $p.WaitForExit(25 * 60 * 1000)
          Copy-Item $log out\auto-disk.log -ErrorAction SilentlyContinue
          Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 120 | Out-Host
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw 'program nie skończył zapisu w 25 minut (zawieszenie)' }
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          $parts = @(Get-Partition -DiskNumber $disk.Number | Sort-Object Offset)
          $parts | Format-Table PartitionNumber, Offset, Size, GptType | Out-Host
          $boot = $parts | Get-Volume | Where-Object { $_.FileSystemLabel -eq 'SHRIMP_BOOT' }
          $live = $parts | Get-Volume | Where-Object { $_.FileSystemLabel -eq 'SHRIMP_LIVE' }
          if ((Get-Disk -Number $disk.Number).PartitionStyle -ne 'GPT') { throw 'nośnik nie jest GPT' }
          if (-not $boot -or $boot.FileSystem -ne 'FAT32') { throw 'brak partycji FAT32 SHRIMP_BOOT' }
          if (-not $live -or $live.FileSystem -ne 'exFAT') { throw 'brak partycji exFAT SHRIMP_LIVE' }
          "SHRIMP_BOOT: $($boot.Size) B, SHRIMP_LIVE: $($live.Size) B"
          # Wielkość liter jak w obrazie (Joliet): GRUB i initrd szukają dokładnych nazw.
          foreach ($f in 'EFI\BOOT\bootx64.efi', 'boot\x86_64\loader\initrd', 'boot\grub2\shrimp-lang.cfg') {
            $i = Get-Item -LiteralPath (Join-Path $boot.Path $f) -ErrorAction SilentlyContinue
            if (-not $i) { throw "brak $f na SHRIMP_BOOT" }
            if ($i.Name -cne (Split-Path $f -Leaf)) { throw "nazwa $($i.Name) zamiast $(Split-Path $f -Leaf)" }
          }
          foreach ($f in 'LiveOS\squashfs.img', 'shrimp-transfer\shrimp.json', 'shrimp-backup\manifest.tsv', 'shrimp-backup\files\lista zakupów.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $live.Path $f))) { throw "brak $f na SHRIMP_LIVE" }
          }
          if (Test-Path -LiteralPath (Join-Path $boot.Path 'LiveOS')) { throw 'LiveOS na partycji FAT32' }
          "nośnik gotowy: $((Get-Item -LiteralPath (Join-Path $live.Path 'LiveOS\squashfs.img')).Length) B squashfs"
          Get-Content -LiteralPath (Join-Path $live.Path 'shrimp-backup\manifest.tsv') | Out-Host
          Get-Content -LiteralPath (Join-Path $live.Path 'shrimp-transfer\shrimp.json') -Raw | Out-Host
      - name: "Okno z WebView2 (tryb --demo), program uruchamia się na każdym ekranie"
        run: |
          foreach ($t in 'light', 'dark') {
            foreach ($s in 'start', 'nosnik', 'pliki', 'postep') {
              $p = Start-Process out\shrimp-install.exe -ArgumentList '--demo', '--screen', $s, '--theme', $t -PassThru
              Start-Sleep -Seconds 8
              $p.Refresh()
              if ($p.HasExited) { throw "program zakończył się (kod $($p.ExitCode)) na ekranie $s" }
              "${t}/${s}: okno '$($p.MainWindowTitle)'"
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 2
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: shrimp-install, path: out }
